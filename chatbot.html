{% extends "base.html" %}
{% block title %}StockMind - Chatbot{% endblock %}
{% set active = "chatbot" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
{% endblock %}
{% block content %}
<div class="page">
    <div class="chatbot-widget">
        <div class="chatbot-header">
            <div class="chatbot-header-left">
                <div class="chatbot-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="white"/>
                    </svg>
                </div>
                <div class="chatbot-title">
                    <strong>AI Assistant</strong>
                    <span class="chatbot-status"><i class="dot"></i>Online</span>
                </div>
            </div>
            <a href="/" class="chatbot-close" aria-label="Close">&times;</a>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- messages injected by chatbot.js -->
        </div>

        <div class="chat-input-row">
            <input id="chat-input" placeholder="Ask me anything about this product...">
            <button class="chat-send-btn" id="chat-send" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 20l18-8L3 4v6l12 2-12 2v6z" fill="white"/>
                </svg>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% endblock %}
